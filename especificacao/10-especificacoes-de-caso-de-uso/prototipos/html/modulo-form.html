<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<header class="topbar"><span class="logo">Plataforma de Cursos</span><nav><a href="#" class="ativo">Meus cursos</a><a href="#">Novo curso</a></nav><span class="avatar">ML</span></header>
<main class="center">
  <form class="card form stack">
    <h2 data-estado="padrao erro-titulo erro-posicao">Novo módulo</h2>
    <h2 data-estado="edicao">Editar módulo</h2>

    <div class="field"><label for="titulo">Título</label>
      <input class="input placeholder" type="text" id="titulo" aria-label="Título" placeholder="Título do módulo" data-estado="padrao">
      <input class="input erro placeholder" type="text" aria-label="Título" placeholder="Título do módulo" data-estado="erro-titulo">
      <input class="input" type="text" aria-label="Título" value="Entrevistas" data-estado="edicao">
      <input class="input" type="text" aria-label="Título" value="Síntese de achados" data-estado="erro-posicao">
      <div class="msg-erro" data-estado="erro-titulo" aria-live="polite">Campo obrigatório.</div>
    </div>

    <div class="field"><label for="ordem">Ordem</label>
      <input class="input placeholder" type="text" id="ordem" aria-label="Ordem" placeholder="Ex.: 1" data-estado="padrao erro-titulo">
      <input class="input" type="text" aria-label="Ordem" value="2" data-estado="edicao">
      <input class="input erro" type="text" aria-label="Ordem" value="2" data-estado="erro-posicao">
      <div class="msg-erro" data-estado="erro-posicao" aria-live="polite">Ordem já em uso. Informe outra.</div>
    </div>

    <button class="btn primary block" type="button">Salvar</button>
  </form>
</main>
<script src="_estado.js"></script>
</body>
</html>
