<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recuperar senha</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<header class="topbar"><span class="logo">Plataforma de Cursos</span><nav></nav></header>
<main class="center">
  <form class="card form stack">
    <h1>Recuperar senha</h1>
    <div class="banner info" data-estado="enviado">Se o e-mail existir, enviamos um link de redefinição de senha.</div>
    <div class="banner erro" data-estado="link-expirado">Este link expirou.</div>
    <div class="field" data-estado="padrao"><label>E-mail</label>
      <div class="input">aluno@email.com</div>
    </div>
    <div class="field" data-estado="nova-senha"><label>Nova senha</label>
      <div class="input">••••••••</div>
    </div>
    <div class="field" data-estado="nova-senha"><label>Confirmar nova senha</label>
      <div class="input">••••••••</div>
    </div>
    <button class="btn primary block" data-estado="padrao" type="button">Enviar link</button>
    <button class="btn primary block" data-estado="nova-senha" type="button">Redefinir senha</button>
    <button class="btn primary block" data-estado="link-expirado" type="button">Solicitar novo link</button>
    <button class="btn secondary block" data-estado="enviado" type="button">Voltar ao login</button>
  </form>
</main>
<script src="_estado.js"></script>
</body>
</html>
