name: docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install python-docx==1.2.0
      - name: Validar documento
        run: python3 scripts/build_doc.py --check
      - name: Validar protótipos
        run: python3 scripts/render_prototypes.py --check

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do PR
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validar mensagens de commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9-]+\))?: .+'; then
              echo "Commit fora do padrão Conventional Commits: $subject"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          exit $fail
